<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CoDev Workspace</title>
    <script>
      // CoDev brand bridge (first-party, not part of upstream Orca): the
      // vendored client's "star Orca on GitHub" nag surfaces (StarNagCard,
      // StarNagToastHost) subscribe to `window.api.starNag.onShow` during
      // their first render effect, so patching the callback after the app
      // boots is too late. Trapping the `window.api` assignment lets us
      // neuter those two methods the instant the preload API is installed,
      // before React mounts anything. Re-check after upgrading the vendored
      // Orca bundle in case the starNag API shape changes.
      (function () {
        var current;
        Object.defineProperty(window, "api", {
          configurable: true,
          get: function () {
            return current;
          },
          set: function (value) {
            current = value;
            try {
              if (value && value.starNag) {
                value.starNag.onShow = function () {
                  return function () {};
                };
                value.starNag.onHide = function () {
                  return function () {};
                };
              }
            } catch (_err) {
              // Best-effort; stock star-nag behavior is fine as a fallback.
            }
          },
        });
      })();
    </script>
    <script>
      // CoDev brand bridge (first-party): default the "Orca Mobile" sidebar
      // shortcut off. `showMobileButton` is a browser-local-only setting
      // (never synced with a paired remote host — see web-preload-api.ts's
      // getRuntimeBackedStoredSettings allowlist), so seeding it into the
      // same localStorage key the app reads on boot is both correct and
      // sufficient. This must run before the module script: the settings
      // store hydrates synchronously during initial render, so toggling the
      // setting via window.api.settings.set() after the iframe's `load`
      // event fires is too late to affect the first paint.
      //
      // We can't gate this on "is showMobileButton absent": web-preload-api's
      // `settings.set()` always writes back the *entire* merged settings
      // object (getStoredSettings() defaults + updates), so any unrelated
      // settings.set() call (dismissing the onboarding checklist, opening
      // Automations, etc.) bakes the upstream default of `showMobileButton:
      // true` into storage even though the user never touched that field —
      // which then permanently defeats an absence check. Instead we track
      // our own one-time marker key so the CoDev default applies exactly
      // once per browser, then leaves any later choice (default or explicit
      // Settings toggle) alone for good.
      (function () {
        try {
          var KEY = "orca.web.settings.v1";
          var MARKER = "codevMobileDefaultApplied";
          var raw = window.localStorage.getItem(KEY);
          var settings = raw ? JSON.parse(raw) : {};
          if (settings && typeof settings === "object" && !settings[MARKER]) {
            settings.showMobileButton = false;
            settings[MARKER] = true;
            window.localStorage.setItem(KEY, JSON.stringify(settings));
          }
        } catch (_err) {
          // Best-effort; worst case the sidebar shortcut stays visible until toggled in Settings.
        }
      })();
    </script>

  </head>

  </body>
