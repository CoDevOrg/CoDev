AWSTemplateFormatVersion: "2010-09-09"
Description: CoDev single-host Firecracker runtime and IAM-authenticated control endpoint

Parameters:
  ArtifactBucket:
    Type: String
  ReleaseVersion:
    Type: String
  InstanceType:
    Type: String
    Default: a1.metal
    AllowedPattern: ^[a-z0-9]+[a-z0-9.-]*\.metal$
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-2a
  UbuntuAmi:
    Type: AWS::EC2::Image::Id
    Default: ami-0713df58d0d8b3c1c
  HostVolumeSizeGiB:
    Type: Number
    Default: 40
    MinValue: 40
    MaxValue: 200
  JailerVolumeSizeGiB:
    Type: Number
    Default: 40
    MinValue: 20
    MaxValue: 200
  MonthlyBudgetUsd:
    Type: Number
    Default: 75
    MinValue: 1
  BudgetAlertEmail:
    Type: String
    Default: ""

Conditions:
  HasBudgetAlertEmail: !Not [!Equals [!Ref BudgetAlertEmail, ""]]

Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - user:Project$CoDev
      NotificationsWithSubscribers: !If
        - HasBudgetAlertEmail
        - - Notification:
              ComparisonOperator: GREATER_THAN
              NotificationType: FORECASTED
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - Address: !Ref BudgetAlertEmail
                SubscriptionType: EMAIL
          - Notification:
              ComparisonOperator: GREATER_THAN
              NotificationType: ACTUAL
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - Address: !Ref BudgetAlertEmail
                SubscriptionType: EMAIL
        - !Ref AWS::NoValue

  RuntimeVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: codev-runtime

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref RuntimeVpc

  RuntimeSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref RuntimeVpc
      Tags:
        - Key: Name
          Value: codev-runtime

  RuntimeRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RuntimeVpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref RuntimeRouteTable

  RuntimeSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RuntimeRouteTable
      SubnetId: !Ref RuntimeSubnet

  ProxyLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Lambda proxy for the CoDev orchestrator
      SecurityGroupEgress: []
      VpcId: !Ref RuntimeVpc

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CoDev Firecracker host; no public ingress
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      VpcId: !Ref RuntimeVpc

  CredentialEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Envelope encryption key for CoDev provider credentials
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  CredentialEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/codev-credentials
      TargetKeyId: !Ref CredentialEncryptionKey

  ProxyLambdaToHostEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt ProxyLambdaSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !GetAtt HostSecurityGroup.GroupId

  HostFromProxyLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt HostSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !GetAtt ProxyLambdaSecurityGroup.GroupId

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: codev-firecracker-host
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadRuntimeArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/releases/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}
                Condition:
                  StringLike:
                    s3:prefix: releases/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !Sub "${HostLogGroup.Arn}:*"

  HostLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /codev/orchestrator/${AWS::StackName}
      RetentionInDays: 14

  HostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HostRole

  HostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            timedatectl set-ntp true
            systemctl restart chrony
            chronyc -a makestep
            chronyc waitsync 60 1.0 0.0 2
            systemctl restart snap.amazon-ssm-agent.amazon-ssm-agent.service
            export DEBIAN_FRONTEND=noninteractive
            apt-get -o DPkg::Lock::Timeout=300 update
            apt-get -o DPkg::Lock::Timeout=300 install -y ca-certificates curl unzip
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install --update
            until aws s3 cp s3://${ArtifactBucket}/releases/${ReleaseVersion}/bootstrap-host.sh /tmp/codev-bootstrap-host.sh; do
              sleep 10
            done
            chmod 0700 /tmp/codev-bootstrap-host.sh
            CODEV_ARTIFACT_BUCKET=${ArtifactBucket} CODEV_RELEASE_VERSION=${ReleaseVersion} CODEV_HOST_LOG_GROUP=${HostLogGroup} /tmp/codev-bootstrap-host.sh
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Project
              Value: CoDev
            - Key: ManagedBy
              Value: CloudFormation

  FirecrackerHost:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      LaunchTemplate:
        LaunchTemplateId: !Ref HostLaunchTemplate
        Version: !GetAtt HostLaunchTemplate.LatestVersionNumber
      InstanceInitiatedShutdownBehavior: stop
      IamInstanceProfile: !Ref HostInstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: enabled
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref HostSecurityGroup
          SubnetId: !Ref RuntimeSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref HostVolumeSizeGiB
            VolumeType: gp3
            Iops: 3000
        - DeviceName: /dev/sdf
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref JailerVolumeSizeGiB
            VolumeType: gp3
            Iops: 3000
      Tags:
        - Key: Name
          Value: codev-firecracker-host
        - Key: Project
          Value: CoDev
        - Key: ManagedBy
          Value: CloudFormation

  RuntimeProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  RuntimeProxyFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - ProxyLambdaToHostEgress
      - HostFromProxyLambdaIngress
      - RuntimeProxyLogGroup
    Properties:
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          ORIGIN = os.environ["ORCHESTRATOR_ORIGIN"].rstrip("/")
          HOP_BY_HOP = {
              "authorization",
              "connection",
              "content-length",
              "host",
              "transfer-encoding",
              "x-amz-content-sha256",
              "x-amz-date",
              "x-amz-security-token",
          }

          def handler(event, _context):
              path = event.get("rawPath") or "/"
              query = event.get("rawQueryString") or ""
              url = ORIGIN + path + (("?" + query) if query else "")
              headers = {
                  key: value
                  for key, value in (event.get("headers") or {}).items()
                  if key.lower() not in HOP_BY_HOP
              }
              body = event.get("body")
              if body is not None:
                  body = (
                      base64.b64decode(body)
                      if event.get("isBase64Encoded")
                      else body.encode("utf-8")
                  )
              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=event["requestContext"]["http"]["method"],
              )
              try:
                  response = urllib.request.urlopen(request, timeout=28)
              except urllib.error.HTTPError as error:
                  response = error
              except Exception as error:
                  return {
                      "statusCode": 502,
                      "headers": {"content-type": "application/json"},
                      "body": json.dumps({"error": "Firecracker host unavailable"}),
                  }

              response_body = response.read()
              response_headers = {
                  key: value
                  for key, value in response.headers.items()
                  if key.lower() not in HOP_BY_HOP
              }
              return {
                  "statusCode": response.status,
                  "headers": response_headers,
                  "body": base64.b64encode(response_body).decode("ascii"),
                  "isBase64Encoded": True,
              }
      Environment:
        Variables:
          ORCHESTRATOR_ORIGIN: !Sub http://${FirecrackerHost.PrivateIp}:8080
      Handler: index.handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RuntimeProxyLogGroup
      MemorySize: 128
      Role: !GetAtt RuntimeProxyRole.Arn
      Runtime: python3.13
      Timeout: 29
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt ProxyLambdaSecurityGroup.GroupId
        SubnetIds:
          - !Ref RuntimeSubnet

  RuntimeProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/codev-runtime-managed-${AWS::StackName}
      RetentionInDays: 14

  RuntimeApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/codev-runtime-${AWS::StackName}
      RetentionInDays: 14

  RuntimeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Description: IAM-authenticated CoDev sandbox control API
      DisableExecuteApiEndpoint: false
      Name: codev-runtime
      ProtocolType: HTTP

  RuntimeLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RuntimeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RuntimeProxyFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  RuntimeProxyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RuntimeProxyFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RuntimeApi}/*/*

  RuntimeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RuntimeApi
      AuthorizationType: AWS_IAM
      RouteKey: ANY /{proxy+}
      Target: !Sub integrations/${RuntimeLambdaIntegration}

  RuntimeStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RuntimeApi
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      AccessLogSettings:
        DestinationArn: !GetAtt RuntimeApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}
      StageName: $default

  RuntimeApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CoDev runtime API returned server errors
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: 5xx
      Namespace: AWS/ApiGateway
      Period: 300
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ApiId
          Value: !Ref RuntimeApi
        - Name: Stage
          Value: $default

  RuntimeProxyErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CoDev runtime proxy Lambda failed
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref RuntimeProxyFunction

  FirecrackerHostStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CoDev Firecracker host failed an EC2 status check
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      Period: 60
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: notBreaching
      Dimensions:
        - Name: InstanceId
          Value: !Ref FirecrackerHost

  RuntimeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub codev-runtime-${AWS::StackName}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Runtime API and Lambda",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${RuntimeApi}", "Stage", "$default"],
                  [".", "5xx", ".", ".", ".", "."],
                  ["AWS/Lambda", "Errors", "FunctionName", "${RuntimeProxyFunction}"],
                  [".", "Duration", ".", ".", {"stat": "p95"}]
                ]
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Firecracker host",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/EC2", "StatusCheckFailed", "InstanceId", "${FirecrackerHost}"],
                  [".", "CPUUtilization", ".", "."]
                ]
              }
            }
          ]
        }

Outputs:
  CredentialEncryptionKeyArn:
    Description: Configure this ARN as CREDENTIAL_KMS_KEY_ID in the Vercel control-plane environment.
    Value: !GetAtt CredentialEncryptionKey.Arn
  ApiId:
    Value: !Ref RuntimeApi
  ApiUrl:
    Value: !GetAtt RuntimeApi.ApiEndpoint
  HostInstanceId:
    Value: !Ref FirecrackerHost
  RuntimeVpcId:
    Value: !Ref RuntimeVpc
  RuntimeDashboardName:
    Value: !Ref RuntimeDashboard
  MonthlyBudgetName:
    Value: !Sub ${AWS::StackName}-monthly
