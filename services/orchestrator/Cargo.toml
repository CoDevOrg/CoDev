[package]
name = "codev-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = "0.8.4"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
hex = "0.4.3"
portable-pty = "0.9.0"
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
wait-timeout = "0.2.1"
tower = { version = "0.5.2", features = ["util"] }
toml_edit = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.175"
vsock = "0.5.2"

[dev-dependencies]
tempfile = "3.21.0"
