name: Workspace lifecycle reconciliation

on:
  schedule:
    # Exact 45-minute cadence in UTC: 00:00, 00:45, 01:30, 02:15, ...
    - cron: "0 0-23/3 * * *"
    - cron: "45 0-23/3 * * *"
    - cron: "30 1-23/3 * * *"
    - cron: "15 2-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile workspaces
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://codev-xi.vercel.app/api/cron/lifecycle
