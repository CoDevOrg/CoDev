name: Verify workspace runtime

on:
  pull_request:
    paths:
      - "packages/ide/**"
      - "infra/aws/**"
      - "services/**"
      - ".github/workflows/verify-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Match Deploy runtime so this exercises the toolchain that failed there.
          version: 11.5.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot squashfs-tools xz-utils xvfb xauth \
            libgtk-3-0t64 libnss3 libnspr4 libasound2t64 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1 \
            libxss1 libxtst6 libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libglib2.0-0t64 libdbus-1-3 fonts-liberation xdg-utils zlib1g-dev
      - name: Test the native-build permission repair
        working-directory: packages/ide
        run: node --test config/scripts/prepare-pnpm-native-build.test.mjs
      - name: Build the deployable runtime without AWS credentials
        run: ./infra/aws/scripts/build-orca-serve.sh "$RUNNER_TEMP/codev-artifact" x86_64
      - name: Verify packaged terminals and server readiness
        working-directory: packages/ide
        run: xvfb-run -a node scripts/verify-serve-artifact.mjs | tee "$RUNNER_TEMP/codev-runtime-evidence.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-runtime-verification
          path: |
            ${{ runner.temp }}/codev-runtime-evidence.jsonl
            ${{ runner.temp }}/codev-artifact/*.sha256
          if-no-files-found: error
          retention-days: 7
