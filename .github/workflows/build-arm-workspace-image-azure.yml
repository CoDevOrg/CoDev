name: Build ARM workspace image (Azure)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable artifact prefix, for example 2026.10.04.1
        required: true
        type: string
      image_version:
        description: Candidate Compute Gallery version, for example 1.0.0
        required: true
        type: string
  # The automated release pipeline (release-arm-image.yml) builds through this.
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      image_version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-arm-workspace-image-azure
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    environment: arm-workspace
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CODEV_ARTIFACT_ACCOUNT: ${{ vars.CODEV_ARTIFACT_ACCOUNT }}
      CODEV_RELEASE_VERSION: ${{ inputs.release_version }}
      CODEV_IMAGE_VERSION: ${{ inputs.image_version }}
      CODEV_SOURCE_IMAGE_VERSION: ${{ vars.ARM_WORKSPACE_SOURCE_IMAGE_VERSION || '24.04.202609040' }}
    steps:
      - name: Require the isolated Azure build identity
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Candidate images can only be signed from the main branch." >&2
            exit 1
          fi
          missing=""
          [ -z "$AZURE_CLIENT_ID" ] && missing="$missing AZURE_CLIENT_ID"
          [ -z "$AZURE_TENANT_ID" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "$AZURE_SUBSCRIPTION_ID" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -z "$AZURE_RESOURCE_GROUP" ] && missing="$missing AZURE_RESOURCE_GROUP"
          [ -z "$CODEV_ARTIFACT_ACCOUNT" ] && missing="$missing CODEV_ARTIFACT_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::Configure the arm-workspace environment variables:$missing." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: vendor/superset/.bun-version

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare private artifact storage
        run: |
          AZURE_ARTIFACT_UPLOADER_OBJECT_ID="$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv)" \
          AZURE_ARTIFACT_UPLOADER_TYPE=ServicePrincipal \
            infra/azure/prepare-arm-workspace-artifacts.sh

      - name: Build and test native ARM64 runtime artifacts
        run: infra/runtime/scripts/build-arm-workspace-runtime.sh "$RUNNER_TEMP/arm-release"

      - name: Sign runtime artifacts with keyless Sigstore provenance
        shell: bash
        run: |
          cosign_url="https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-arm64"
          cosign_sha256="c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a"
          curl -fsSL "$cosign_url" -o "$RUNNER_TEMP/cosign"
          printf '%s  %s\n' "$cosign_sha256" "$RUNNER_TEMP/cosign" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/cosign"
          for name in \
            superset-host-linux-arm64.tar.gz \
            codev-guestd-linux-arm64 \
            verify-superset-host-artifact.mjs \
            runtime-manifest.json; do
            "$RUNNER_TEMP/cosign" sign-blob --yes \
              --bundle "$RUNNER_TEMP/arm-release/$name.sigstore.json" \
              "$RUNNER_TEMP/arm-release/$name"
          done

      - name: Upload immutable runtime artifacts
        shell: bash
        run: |
          for artifact in "$RUNNER_TEMP"/arm-release/*; do
            name="$(basename "$artifact")"
            az storage blob upload \
              --account-name "$CODEV_ARTIFACT_ACCOUNT" \
              --container-name releases \
              --name "$CODEV_RELEASE_VERSION/$name" \
              --file "$artifact" \
              --overwrite false --auth-mode login --only-show-errors --no-progress >/dev/null
          done

      - name: Publish isolated ARM64 workspace VM candidate image
        run: infra/azure/build-arm-workspace-image.sh
