# Ships apps/web to the Vercel project. The public trycodev.com Worker is
# built and deployed by the Cloudflare job in ci.yml. The Vercel Git
# integration is off (git.deploymentEnabled = false in vercel.json).
name: Deploy web

on:
  push:
    branches:
      - "**"
    # Mirrors scripts/vercel-ignore-build.sh: only the paths whose contents
    # end up in, or change, the built web app. A push that touches only the
    # orchestrator, infra, the IDE fork source, docs, or CI config still
    # skips the minutes-long Next.js build.
    paths:
      - "apps/web/**"
      - "packages/config/**"
      - "packages/contracts/**"
      - "packages/db/**"
      - "packages/shared-types/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "vercel.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy per branch. A newer push to the same branch supersedes an
  # in-flight build, so cancel it rather than pay for both — the newer commit
  # already sits on top of the one it cancels.
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not secrets — these identifiers appear in every deployment URL and
  # inspector link already. The token is the only credential.
  VERCEL_ORG_ID: team_8tQg0IbclwFRP8sVXOqjvbLU
  VERCEL_PROJECT_ID: prj_N5FCzLUHDVkhId6TGqF6xU9KrvEV
  VERCEL_SCOPE: co-dev-admins
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require VERCEL_TOKEN
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::Set the repository secret VERCEL_TOKEN to a Vercel token with access to the \"CoDev Admins\" team (Vercel -> Account Settings -> Tokens)." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Check token
        run: |
          if ! who="$(vercel whoami --token="$VERCEL_TOKEN" 2>&1)"; then
            echo "::error::VERCEL_TOKEN is set but not a valid Vercel token (\`vercel whoami\` said: ${who}). Create one at https://vercel.com/account/tokens with access to the \"CoDev Admins\" team and paste only the token value into the repository secret VERCEL_TOKEN."
            exit 1
          fi
          echo "Authenticated as: ${who}"
          echo "--- projects visible in $VERCEL_SCOPE ---"
          vercel project ls --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" 2>&1 || true

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "env=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize production ARM boot configuration
        if: github.ref == 'refs/heads/main'
        env:
          ARM_WORKSPACE_RUNTIME_SECRETS: ${{ secrets.ARM_WORKSPACE_RUNTIME_SECRETS }}
          ARM_WORKSPACE_BOOT_ENABLED: ${{ vars.ARM_WORKSPACE_BOOT_ENABLED || 'false' }}
        run: |
          node --input-type=module <<'JS'
          const arm = JSON.parse(process.env.ARM_WORKSPACE_RUNTIME_SECRETS || "{}");
          if (!arm.ARM_WORKSPACE_IMAGE_VERSION_ID) throw new Error("ARM image configuration is missing");
          const root = `https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`;
          const team = `?teamId=${process.env.VERCEL_ORG_ID}`;
          const headers = { authorization: `Bearer ${process.env.VERCEL_TOKEN}`, "content-type": "application/json" };
          const inventory = await fetch(root + team, { headers });
          if (!inventory.ok) throw new Error(`Vercel environment inventory failed: ${inventory.status}`);
          const { envs } = await inventory.json();
          const values = { ARM_WORKSPACE_IMAGE_VERSION_ID: arm.ARM_WORKSPACE_IMAGE_VERSION_ID, ARM_WORKSPACE_BOOT_ENABLED: process.env.ARM_WORKSPACE_BOOT_ENABLED };
          for (const [key, value] of Object.entries(values)) {
            const current = envs.find(env => env.key === key && env.target?.includes("production"));
            const response = await fetch(current ? `${root}/${current.id}${team}` : root + team, {
              method: current ? "PATCH" : "POST", headers,
              body: JSON.stringify(current ? { value } : { key, value, type: "plain", target: ["production"] }),
            });
            if (!response.ok) throw new Error(`Vercel configuration update failed for ${key}: ${response.status}`);
          }
          console.log("Production ARM image and boot flag synchronized.");
          JS

      - name: Pull Vercel project settings
        run: vercel pull --yes --scope="$VERCEL_SCOPE" --environment=${{ steps.target.outputs.env }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }}

      - name: Verify database schema before deployment
        run: pnpm exec dotenv -e .vercel/.env.${{ steps.target.outputs.env }}.local -- pnpm --filter @codev/db db:check

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --no-wait --archive=tgz --scope="$VERCEL_SCOPE" ${{ steps.target.outputs.flag }})"
          echo "Deployment accepted by Vercel: ${url}"
          {
            echo "### Vercel ${{ steps.target.outputs.env }} deploy"
            echo ""
            echo "${url}"
          } >> "$GITHUB_STEP_SUMMARY"
