# Rolls out the Azure runtime, the counterpart of deploy-runtime.yml.
#
# This is a separate workflow rather than a branch inside the AWS one on
# purpose: while the migration is in flight both runtimes exist, and a single
# workflow that chose between them would make "which cloud did this commit
# actually ship to" a question you answer by reading logs. Two workflows make
# it a question you answer by looking at which one ran.
#
# Authentication is OIDC end to end. There is no Azure client secret in this
# repository's secrets, only the three non-sensitive ids below, because the
# app registration trusts GitHub's token through a federated credential
# matched on this repo and ref.
name: Deploy runtime (Azure)

on:
  push:
    branches:
      - main
    paths:
      - "packages/ide/**"
      - "services/**"
      - "infra/azure/**"
      - "infra/aws/scripts/bootstrap-host.sh"
      - "infra/aws/scripts/build-orca-serve.sh"
      - ".github/workflows/deploy-runtime-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Required for azure/login's OIDC exchange.
  id-token: write

concurrency:
  # Two deploys at once would race the same deployment name and the same
  # release prefix. Queue instead, and never cancel one midway: a
  # half-applied stack is worse than a slow one.
  group: deploy-runtime-azure
  cancel-in-progress: false

jobs:
  deploy:
    # Same distro and architecture the Containerfile starts from, so
    # build-orca-serve.sh builds in place rather than needing a container.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - name: Require the Azure identity to be configured
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          [ -z "${CLIENT_ID}" ] && missing="${missing} AZURE_CLIENT_ID"
          [ -z "${TENANT_ID}" ] && missing="${missing} AZURE_TENANT_ID"
          [ -z "${SUBSCRIPTION_ID}" ] && missing="${missing} AZURE_SUBSCRIPTION_ID"
          if [ -n "${missing}" ]; then
            echo "::error::Set the repository variables:${missing}. See docs/OPERATIONS.md, \"Azure runtime deploy credentials\"." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # electron-builder spawns the freshly unpacked, not-yet-bundled electron
      # binary during the build (native module rebuild, icon generation), so
      # the runner needs the shared libraries a desktop Chromium needs. Kept
      # in step with infra/aws/orca-build/Containerfile's apt list.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot rpm squashfs-tools xz-utils \
            libgtk-3-0t64 libnss3 libnspr4 libasound2t64 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1 \
            libxss1 libxtst6 libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libglib2.0-0t64 libdbus-1-3 fonts-liberation xdg-utils zlib1g-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Rust toolchain the orchestrator builds with
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add x86_64-unknown-linux-musl

      # deploy.sh builds the orchestrator with cargo-zigbuild, which needs
      # zig. The ziglang wheel is zig's own supported install path and avoids
      # adding a third-party action to the deploy's supply chain.
      - name: Install cargo-zigbuild
        run: |
          pip install --user ziglang || pip install --user --break-system-packages ziglang
          cargo install cargo-zigbuild --locked

      - name: Deploy the runtime
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus2' }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # The host's authorized key. A variable rather than a secret: a
          # public key is not sensitive, and keeping it visible makes it
          # obvious which key can reach the runtime.
          CODEV_HOST_SSH_PUBLIC_KEY: ${{ vars.CODEV_HOST_SSH_PUBLIC_KEY }}
          CODEV_BUDGET_ALERT_EMAIL: ${{ vars.CODEV_BUDGET_ALERT_EMAIL }}
          CODEV_ENABLE_BUDGET: ${{ vars.CODEV_ENABLE_BUDGET || 'false' }}
        # No CODEV_RELEASE_VERSION: deploy.sh derives it from HEAD, so the
        # same commit deployed from CI and from a laptop lands on one release
        # prefix rather than two.
        run: ./infra/azure/deploy.sh
