name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @codev/web exec vite build
      # Gen 1 cleanup removed this fixture route. Keep the legacy browser suite
      # available when the route returns, but don't block current deployments.
      - name: Install Playwright browser
        if: ${{ hashFiles('apps/web/app/verification/b0-2/page.tsx') != '' }}
        run: pnpm --filter @codev/web exec playwright install --with-deps chromium
      - name: Run fixture end-to-end tests
        if: ${{ hashFiles('apps/web/app/verification/b0-2/page.tsx') != '' }}
        run: pnpm test:e2e

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: pnpm rust:check

  superset-host:
    # These tests exercise node-pty, the PTY daemon, private credential
    # profiles, and hook attribution. They need Linux; the UID-isolation
    # case also needs root and setpriv, which the hosted Ubuntu runner has.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: vendor/superset/.bun-version

      - name: Install Superset host dependencies
        working-directory: vendor/superset
        run: CI=1 ELECTRON_SKIP_BINARY_DOWNLOAD=1 bun install --frozen-lockfile

      - name: Build the PTY daemon bundle
        working-directory: vendor/superset/packages/pty-daemon
        run: bun run build:daemon

      - name: Test terminal and daemon integration
        working-directory: vendor/superset/packages/host-service
        run: |
          bun run test:integration:terminal
          bun run test:integration:terminal-raw
          bun run test:integration:daemon

      - name: Test agent hooks and bindings
        working-directory: vendor/superset/packages/host-service
        run: bun test src/codev/agents.test.ts src/trpc/router/notifications/notifications.test.ts src/terminal-agents/store.test.ts src/terminal-agents/subagent-harnesses.test.ts

      - name: Test private profiles across Linux UIDs
        working-directory: vendor/superset/packages/host-service
        run: sudo --preserve-env=PATH node --experimental-strip-types --test src/codev/agent-isolation.node-test.ts

  deploy-cloudflare:
    name: Deploy Cloudflare production Worker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, rust, superset-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before deploying the production Worker." >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository variable before deploying the production Worker." >&2
            exit 1
          fi
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Add the CRON_SECRET repository secret before deploying the production Worker." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare Worker
        run: pnpm --filter @codev/web exec vite build

      - name: Deploy Cloudflare Worker
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/cloudflare-secrets.env"
          printf 'CRON_SECRET=%s\n' "$CRON_SECRET" > "$secrets_file"
          pnpm --filter @codev/web exec cf deploy --prebuilt --secrets-file "$secrets_file" --message "GitHub Actions ${GITHUB_SHA}"
