name: ARM workspace Phase 2 canary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: arm-workspace
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CODEV_ARTIFACT_ACCOUNT: ${{ vars.CODEV_ARTIFACT_ACCOUNT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PHASE2_SIGNING_KEY: ${{ runner.temp }}/phase2-signing.pem
      PHASE2_VERIFY_KEY: ${{ runner.temp }}/phase2-verify.pem
      PHASE2_SSH_PUBLIC_KEY: ${{ runner.temp }}/phase2-ssh.pub
    steps:
      - name: Require isolated main-branch canary
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$AZURE_RESOURCE_GROUP" = codev-arm-workspace-phase1
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create temporary canary keys
        run: |
          umask 077
          openssl genpkey -algorithm Ed25519 -out "$PHASE2_SIGNING_KEY"
          openssl pkey -in "$PHASE2_SIGNING_KEY" -pubout -out "$PHASE2_VERIFY_KEY"
          ssh-keygen -q -t ed25519 -N '' -f "${RUNNER_TEMP}/phase2-ssh"
      - name: Exercise create, stop, reopen, idle, and delete
        run: node infra/azure/arm-workspace-phase2-canary.mjs
