# Rolls out the AWS runtime — `orca serve`, the orchestrator, guestd, the
# bootstrap scripts and the CloudFormation stacks — so a push ships them the
# way a push already ships the web app.
#
# Vercel deploys apps/web (including the checked-in renderer bundle at
# apps/web/public/orca) on every push by itself, but nothing shipped
# packages/ide/src/main/** or services/**: those ride infra/aws/deploy.sh,
# which until now only ran from a maintainer's own machine. A change to the
# IDE's main process could therefore sit merged and inert while the renderer
# half of the same commit was live.
name: Deploy runtime

on:
  push:
    branches:
      - main
    # Only the paths that end up inside a release artifact or the stacks.
    # Everything else already deploys through Vercel alone, and this build
    # takes tens of minutes, so running it for a docs push would be pure cost.
    paths:
      - "packages/ide/**"
      - "services/**"
      - "infra/aws/**"
      - ".github/workflows/deploy-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Required by aws-actions/configure-aws-credentials for OIDC.
  id-token: write

concurrency:
  # Two deploys at once would race the same CloudFormation stacks and the same
  # release prefix. Queue instead — and never cancel one midway, since a
  # half-applied stack update is worse than a slow one.
  group: deploy-runtime
  cancel-in-progress: false

jobs:
  deploy:
    # ubuntu-24.04 is the same distro and architecture the Containerfile starts
    # from, so build-orca-serve.sh builds in place here instead of needing
    # Apple's `container` (or Docker, which this repo does not use).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - name: Require the deploy role to be configured
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Set the repository variable AWS_DEPLOY_ROLE_ARN to the IAM role GitHub should assume. See docs/OPERATIONS.md, \"Runtime deploy credentials\"." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      # electron-builder spawns the freshly unpacked, not-yet-bundled electron
      # binary during the build (native module rebuild, icon generation), so
      # the runner needs the shared libraries a desktop Chromium needs. Kept in
      # step with infra/aws/orca-build/Containerfile's apt list.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot rpm squashfs-tools xz-utils \
            libgtk-3-0t64 libnss3 libnspr4 libasound2t64 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1 \
            libxss1 libxtst6 libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libglib2.0-0t64 libdbus-1-3 fonts-liberation xdg-utils zlib1g-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Rust toolchain the orchestrator builds with
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add x86_64-unknown-linux-musl

      # deploy.sh builds the orchestrator with cargo-zigbuild, which needs zig.
      # The ziglang wheel is zig's own supported install path and avoids adding
      # a third-party action to the deploy's supply chain.
      - name: Install cargo-zigbuild
        run: |
          pip install --user ziglang || pip install --user --break-system-packages ziglang
          cargo install cargo-zigbuild --locked

      - name: Deploy the runtime
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        # No CODEV_RELEASE_VERSION: deploy.sh derives it from HEAD, so the same
        # commit deployed from CI and from a laptop lands on one release
        # prefix rather than two.
        run: ./infra/aws/deploy.sh
